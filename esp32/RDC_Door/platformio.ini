; RDC GYM - ESP32 Door Access Controller
; Board: ESP32 DEVKITV1
; Registry dependencies installed automatically by PlatformIO.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.1
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -D CORE_DEBUG_LEVEL=1

